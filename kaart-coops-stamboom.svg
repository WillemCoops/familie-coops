<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="690" viewBox="0 0 1040 690" role="img" aria-labelledby="title desc">
  <title id="title">Stamboom van de familie Coops</title>
  <desc id="desc">Generaties I tot en met VI vanaf Coop Muller de Oude. Bij generatie VI staan de genoemde kinderen van Coop Coops uit Hengelo en Jan Coops uit Zelhem.</desc>
