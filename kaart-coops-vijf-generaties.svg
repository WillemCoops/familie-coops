<svg xmlns="http://www.w3.org/2000/svg" width="880" height="550" viewBox="0 0 880 550" role="img" aria-labelledby="title description">
  <title id="title">Familie Coops · De eerste vijf generaties</title>
  <desc id="description">Coop Muller de Oude, Coop de jonge muller en Jan Coops vormen generaties één tot en met drie. Jan heeft zes in de genealogie vermelde kinderen. Van Herman en Hendrik staan ook de zeven vermelde kinderen in generatie vijf in dit overzicht.</desc>
